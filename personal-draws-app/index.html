<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Draws Ledger</title>
<style>
  body { margin: 0; }
  #acct-root {
    --paper: #f6f3ec; --ink: #1e2a33; --ink-soft: #5b6a74; --rule: #d8d1c0;
    --credit: #4d6b53; --debit: #9c4a3c; --gold: #a9793f; --card: #fffdf8;
    font-family: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    color: var(--ink); background: var(--paper); padding: 28px 18px 60px;
    max-width: 820px; margin: 0 auto; box-sizing: border-box; min-height: 100vh;
  }
  #acct-root * { box-sizing: border-box; }
  .a-num { font-family: 'Courier New', Menlo, monospace; font-variant-numeric: tabular-nums; }
  .a-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px double var(--ink); padding-bottom: 14px; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
  .a-title { font-size: 24px; letter-spacing: 0.02em; font-weight: 600; }
  .a-sub { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; }
  .a-select { font-family: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; }
  .a-btn { font-family: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--ink); color: var(--paper); border: none; padding: 7px 14px; border-radius: 2px; cursor: pointer; }
  .a-btn:hover { background: var(--gold); }
  .a-panel { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; margin-bottom: 18px; }
  .a-panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 10px; }
  .a-big { font-size: 26px; font-weight: 700; }
  .a-note { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .a-balances { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .a-bal-card { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 14px 10px; text-align: center; }
  .a-bal-name { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .a-bal-amt { font-size: 19px; font-weight: 700; }
  .a-bal-amt.pos { color: var(--credit); }
  .a-bal-amt.neg { color: var(--debit); }
  .a-bal-caption { font-size: 10px; color: var(--ink-soft); margin-top: 3px; }
  .a-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin: 26px 0 12px; cursor: default; }
  .a-settle { background: var(--card); border: 1px solid var(--rule); border-left: 3px solid var(--gold); padding: 12px 14px; font-size: 14px; margin-bottom: 6px; border-radius: 2px; }
  .a-settle-empty { color: var(--ink-soft); font-size: 13px; font-style: italic; }
  .a-form { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; margin-bottom: 8px; }
  .a-form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .a-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .a-tab { font-family: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 12px; border: 1px solid var(--rule); background: transparent; cursor: pointer; color: var(--ink-soft); border-radius: 2px; }
  .a-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .a-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
  .a-field label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
  .a-field input, .a-field select { font-family: inherit; font-size: 14px; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; color: var(--ink); }
  .a-add-btn { font-family: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; background: var(--ink); color: var(--paper); border: none; padding: 9px 18px; border-radius: 2px; cursor: pointer; margin-top: 4px; }
  .a-add-btn:hover { background: var(--gold); }
  .a-entries { margin-top: 4px; }
  .a-entry { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--rule); font-size: 13px; gap: 10px; }
  .a-entry-left { flex: 1; min-width: 0; }
  .a-entry-desc { font-weight: 600; }
  .a-entry-meta { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .a-entry-amt { white-space: nowrap; font-weight: 700; }
  .a-entry-amt.debit { color: var(--debit); }
  .a-entry-amt.credit { color: var(--credit); }
  .a-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; padding: 2px 6px; }
  .a-del:hover { color: var(--debit); }
  .a-empty { color: var(--ink-soft); font-style: italic; font-size: 13px; padding: 16px 4px; }
  .a-loading { color: var(--ink-soft); font-size: 13px; padding: 20px 4px; }
  .a-error { color: var(--debit); font-size: 13px; padding: 10px; background: #fff0ee; border: 1px solid var(--debit); border-radius: 3px; margin-bottom: 14px; }
  .a-gate { max-width: 330px; margin: 12vh auto 0; padding: 0 16px; }
  .a-gate-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); margin-bottom: 8px; }
  .a-gate-sub { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 18px; }
</style>
</head>
<body>
<div id="acct-root"></div>
<script>
let people = ["Simon", "Isaac"];
let entries = [];
let settlements = [];
let currentUser = 0;
let tab = "account";
let loadError = null;

function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function loadData() {
  try {
    const r = await fetch('/api/data');
    if (r.status === 401) { needsLogin = true; renderLogin(); return; }
    if (!r.ok) throw new Error('Server error ' + r.status);
    const data = await r.json();
    people = data.people || people;
    entries = data.entries || [];
    settlements = data.settlements || [];
    loadError = null;
  } catch (e) {
    loadError = "Couldn't load saved data (" + e.message + "). Try refreshing.";
  }
  render();
}

async function saveData() {
  try {
    const r = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ people, entries, settlements })
    });
    if (r.status === 401) { needsLogin = true; renderLogin(); return; }
  } catch (e) { console.error("Save failed", e); }
}

function computeStats() {
  let accountBalance = 0;
  const net = [0, 0];
  entries.filter(e => !e.deleted).forEach(e => {
    const pIdx = people.indexOf(e.person);
    const signed = e.kind === "credit" ? e.amount : -e.amount;
    accountBalance += signed;
    if (pIdx >= 0) net[pIdx] += signed;
  });
  settlements.filter(s => !s.deleted).forEach(s => { net[s.from] += s.amount; net[s.to] -= s.amount; });
  const gap = net[0] - net[1];
  return { accountBalance, net, gap };
}

function setCurrentUser(i) { currentUser = i; render(); }
function setTab(t) { tab = t; render(); }

function addEntry() {
  const desc = document.getElementById("e-desc").value.trim();
  const amount = parseFloat(document.getElementById("e-amount").value);
  const date = document.getElementById("e-date").value;
  const person = document.getElementById("e-person").value;
  const kind = document.getElementById("e-kind").value;
  if (!desc || !amount || amount <= 0) return;
  entries = [{ id: Date.now(), date, desc, person, kind, amount, addedBy: currentUser }, ...entries];
  saveData();
  document.getElementById("e-desc").value = "";
  document.getElementById("e-amount").value = "";
  render();
}

function deleteEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  e.deleted = true; e.deletedBy = currentUser;
  saveData(); render();
}
function restoreEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  delete e.deleted; delete e.deletedBy;
  saveData(); render();
}

function addSettlement() {
  const desc = document.getElementById("s-desc").value.trim() || "Settlement payment";
  const amount = parseFloat(document.getElementById("s-amount").value);
  const date = document.getElementById("s-date").value;
  const from = parseInt(document.getElementById("s-from").value);
  const to = parseInt(document.getElementById("s-to").value);
  if (!amount || amount <= 0 || from === to) return;
  settlements = [{ id: Date.now(), date, from, to, amount, desc, addedBy: currentUser }, ...settlements];
  saveData();
  document.getElementById("s-amount").value = "";
  render();
}
function deleteSettlement(id) {
  const s = settlements.find(x => x.id === id);
  if (!s) return;
  s.deleted = true; saveData(); render();
}

function exportData() {
  const dateStr = new Date().toISOString().slice(0, 10);
  const stats = computeStats();
  const backup = { people, entries, settlements, exportedAt: new Date().toISOString(), computed: stats };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `personal-draws-backup-${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (children || []).forEach(c => { if (c !== null && c !== undefined) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

let needsLogin = false;

function renderLogin() {
  const root = document.getElementById("acct-root");
  root.innerHTML = "";
  const input = el("input", { type: "password", placeholder: "Password" });
  const err = el("div", { class: "a-error", style: "display:none" }, []);
  async function submit() {
    const pw = input.value;
    if (!pw) return;
    err.style.display = "none";
    btn.disabled = true; btn.textContent = "Checking…";
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { needsLogin = false; loadData(); return; }
      err.textContent = j.error || ('Login failed (' + r.status + ')');
    } catch (e) {
      err.textContent = "Network error: " + e.message;
    }
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Unlock";
    input.value = "";
    input.focus();
  }
  const btn = el("button", { class: "a-add-btn", style: "width:100%;margin-top:0", onClick: submit }, ["Unlock"]);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") submit(); });
  root.appendChild(el("div", { class: "a-gate" }, [
    el("div", { class: "a-gate-title" }, ["Personal Draws Ledger"]),
    el("div", { class: "a-gate-sub" }, ["This ledger is private. Enter the password to continue."]),
    err,
    el("div", { class: "a-field", style: "margin-bottom:14px" }, [input]),
    btn
  ]));
  input.focus();
}

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  needsLogin = true;
  renderLogin();
}

function render() {
  const root = document.getElementById("acct-root");
  root.innerHTML = "";
  if (loadError) root.appendChild(el("div", { class: "a-error" }, [loadError]));
  const stats = computeStats();

  const actingSelect = el("select", { class: "a-select" });
  people.forEach((p, i) => {
    const opt = el("option", { value: i }, [p]);
    if (i === currentUser) opt.setAttribute("selected", "selected");
    actingSelect.appendChild(opt);
  });
  actingSelect.addEventListener("change", e => setCurrentUser(parseInt(e.target.value)));

  root.appendChild(el("div", { class: "a-header" }, [
    el("div", {}, [
      el("div", { class: "a-title" }, ["Personal Draws Ledger"]),
      el("div", { class: "a-sub" }, [`${people[0]} & ${people[1]} — personal money taken from & repaid to the shared account`])
    ]),
    el("div", { style: "text-align:right" }, [
      el("div", { class: "a-sub", style: "margin-bottom:4px" }, ["I am"]),
      actingSelect,
      el("button", { class: "a-btn", style: "margin-top:8px;display:block;width:100%", onClick: exportData }, ["Download backup"]),
      el("button", { class: "a-btn", style: "margin-top:6px;display:block;width:100%", onClick: doLogout }, ["Lock"])
    ])
  ]));

  root.appendChild(el("div", { class: "a-panel" }, [
    el("div", { class: "a-panel-title" }, ["Total personal draws logged (not the account's real balance)"]),
    el("div", { class: "a-big a-num", style: "color:var(--debit)" }, [fmt(Math.abs(stats.accountBalance))]),
    el("div", { class: "a-note" }, ["This only reflects what you two log here as personal spending/repayment — it has nothing to do with the actual account balance, which also has your shared business flows in and out that aren't tracked in this ledger."])
  ]));

  const gap = Math.round(stats.gap * 100) / 100;
  const ahead = gap > 0 ? people[0] : gap < 0 ? people[1] : null;
  const behind = gap > 0 ? people[1] : gap < 0 ? people[0] : null;
  const rawGap = Math.abs(gap);
  const halfGap = rawGap / 2;
  const draw0 = -stats.net[0];
  const draw1 = -stats.net[1];

  root.appendChild(el("div", { class: "a-balances" }, [
    el("div", { class: "a-bal-card" }, [
      el("div", { class: "a-bal-name" }, [people[0]]),
      el("div", { class: "a-bal-amt a-num " + (draw0 > 0.005 ? "neg" : "pos") }, [fmt(Math.abs(draw0))]),
      el("div", { class: "a-bal-caption" }, [draw0 > 0.005 ? "drawn beyond repayment (owes)" : draw0 < -0.005 ? "repaid beyond draws (can take out more)" : "even"])
    ]),
    el("div", { class: "a-bal-card" }, [
      el("div", { class: "a-bal-name" }, [people[1]]),
      el("div", { class: "a-bal-amt a-num " + (draw1 > 0.005 ? "neg" : "pos") }, [fmt(Math.abs(draw1))]),
      el("div", { class: "a-bal-caption" }, [draw1 > 0.005 ? "drawn beyond repayment (owes)" : draw1 < -0.005 ? "repaid beyond draws (can take out more)" : "even"])
    ])
  ]));

  root.appendChild(el("div", { class: "a-section-label" }, ["Settle up"]));
  if (!ahead) {
    root.appendChild(el("div", { class: "a-settle-empty" }, ["Your personal draws are even — nothing to settle."]));
  } else {
    root.appendChild(el("div", { class: "a-settle" }, [el("strong", {}, [behind]), " has drawn ", el("span", { class: "a-num" }, [fmt(rawGap)]), " more than ", el("strong", {}, [ahead]), " relative to what each has repaid. Three ways to close it — pick one:"]));
    root.appendChild(el("div", { class: "a-settle" }, [el("strong", {}, ["1. Direct payment: "]), el("strong", {}, [behind]), " pays ", el("strong", {}, [ahead]), " ", el("span", { class: "a-num" }, [fmt(halfGap)]), " personally. This moves both numbers toward the middle at once, so only half the gap is needed."]));
    root.appendChild(el("div", { class: "a-settle" }, [el("strong", {}, ["2. Repay the account: "]), el("strong", {}, [behind]), " deposits the full ", el("span", { class: "a-num" }, [fmt(rawGap)]), " back into the account. Since this doesn't go to ", el("strong", {}, [ahead]), " directly, it takes the whole gap to bring ", el("strong", {}, [behind]), "'s draw down to match."]));
    root.appendChild(el("div", { class: "a-settle" }, [el("strong", {}, ["3. Draw more: "]), el("strong", {}, [ahead]), " personally draws an additional ", el("span", { class: "a-num" }, [fmt(rawGap)]), " from the account — same logic, only one side moves, so it takes the full gap to catch up."]));
    root.appendChild(el("div", { class: "a-note" }, [`Options 2 and 3 land you both at different totals than option 1 (2 and 3 land you where the "behind" person already is; option 1 lands you both in the middle). Log whichever one you two actually do — option 1 as a "Direct settlement payment" below, options 2 and 3 as a normal personal draw/repayment — and the numbers above update automatically.`]));
  }

  root.appendChild(el("div", { class: "a-section-label" }, ["Log something"]));
  const form = el("div", { class: "a-form" });
  const tabs = el("div", { class: "a-tabs" }, [
    el("button", { class: "a-tab " + (tab === "account" ? "active" : ""), onClick: () => setTab("account") }, ["Personal draw / repayment"]),
    el("button", { class: "a-tab " + (tab === "settlement" ? "active" : ""), onClick: () => setTab("settlement") }, ["Direct settlement payment"])
  ]);
  form.appendChild(tabs);

  if (tab === "account") {
    form.appendChild(el("div", { class: "a-form-row" }, [
      el("div", { class: "a-field" }, [el("label", {}, ["Description"]), el("input", { id: "e-desc", placeholder: "e.g. ZELLE, CAR, rent" })]),
      el("div", { class: "a-field", style: "max-width:120px" }, [el("label", {}, ["Amount"]), el("input", { id: "e-amount", type: "number", placeholder: "0.00" })]),
      el("div", { class: "a-field", style: "max-width:150px" }, [el("label", {}, ["Date"]), el("input", { id: "e-date", type: "date" })])
    ]));
    const personSelect = el("select", { id: "e-person" });
    people.forEach(p => personSelect.appendChild(el("option", { value: p }, [p])));
    const kindSelect = el("select", { id: "e-kind" }, [
      el("option", { value: "debit" }, ["Personal draw (money you took for yourself)"]),
      el("option", { value: "credit" }, ["Repayment (money you put back)"])
    ]);
    form.appendChild(el("div", { class: "a-form-row" }, [
      el("div", { class: "a-field" }, [el("label", {}, ["Who"]), personSelect]),
      el("div", { class: "a-field" }, [el("label", {}, ["Type"]), kindSelect])
    ]));
    form.appendChild(el("button", { class: "a-add-btn", onClick: addEntry }, ["Add entry"]));
    setTimeout(() => { const d = document.getElementById("e-date"); if (d) d.value = new Date().toISOString().slice(0, 10); }, 0);
  } else {
    form.appendChild(el("div", { class: "a-form-row" }, [
      el("div", { class: "a-field" }, [el("label", {}, ["Note"]), el("input", { id: "s-desc", placeholder: "e.g. Venmo to true up" })]),
      el("div", { class: "a-field", style: "max-width:120px" }, [el("label", {}, ["Amount"]), el("input", { id: "s-amount", type: "number", placeholder: "0.00" })]),
      el("div", { class: "a-field", style: "max-width:150px" }, [el("label", {}, ["Date"]), el("input", { id: "s-date", type: "date" })])
    ]));
    const fromSelect = el("select", { id: "s-from" });
    const toSelect = el("select", { id: "s-to" });
    people.forEach((p, i) => { fromSelect.appendChild(el("option", { value: i }, [p])); toSelect.appendChild(el("option", { value: i }, [p])); });
    toSelect.value = "0";
    form.appendChild(el("div", { class: "a-form-row" }, [
      el("div", { class: "a-field" }, [el("label", {}, ["From (pays)"]), fromSelect]),
      el("div", { class: "a-field" }, [el("label", {}, ["To (receives)"]), toSelect])
    ]));
    form.appendChild(el("button", { class: "a-add-btn", onClick: addSettlement }, ["Add settlement"]));
    setTimeout(() => { const d = document.getElementById("s-date"); if (d) d.value = new Date().toISOString().slice(0, 10); }, 0);
  }
  root.appendChild(form);

  const activeSettlements = settlements.filter(s => !s.deleted);
  if (activeSettlements.length > 0) {
    root.appendChild(el("div", { class: "a-section-label" }, [`Settlement payments (${activeSettlements.length})`]));
    const sList = el("div", { class: "a-entries" });
    activeSettlements.forEach(s => {
      sList.appendChild(el("div", { class: "a-entry" }, [
        el("div", { class: "a-entry-left" }, [el("div", { class: "a-entry-desc" }, [s.desc]), el("div", { class: "a-entry-meta" }, [`${s.date} · ${people[s.from]} → ${people[s.to]}`])]),
        el("div", { class: "a-entry-amt a-num" }, [fmt(s.amount)]),
        el("button", { class: "a-del", title: "Delete", onClick: () => deleteSettlement(s.id) }, ["✕"])
      ]));
    });
    root.appendChild(sList);
  }

  const activeEntries = entries.filter(e => !e.deleted);
  root.appendChild(el("div", { class: "a-section-label" }, [`Personal draws & repayments (${activeEntries.length})`]));
  const list = el("div", { class: "a-entries" });
  if (activeEntries.length === 0) {
    list.appendChild(el("div", { class: "a-empty" }, ["No entries yet."]));
  } else {
    activeEntries.forEach(e => {
      const addedByName = e.addedBy !== undefined ? people[e.addedBy] : null;
      const kindLabel = e.kind === "credit" ? "repayment" : "personal draw";
      const meta = `${e.date} · ${e.person} · ${kindLabel}` + (addedByName ? ` · added by ${addedByName}` : "");
      list.appendChild(el("div", { class: "a-entry" }, [
        el("div", { class: "a-entry-left" }, [el("div", { class: "a-entry-desc" }, [e.desc]), el("div", { class: "a-entry-meta" }, [meta])]),
        el("div", { class: "a-entry-amt a-num " + e.kind }, [(e.kind === "debit" ? "-" : "+") + fmt(e.amount)]),
        el("button", { class: "a-del", title: "Delete", onClick: () => deleteEntry(e.id) }, ["✕"])
      ]));
    });
  }
  root.appendChild(list);
}

document.getElementById("acct-root").innerHTML = '<div class="a-loading">Loading account history…</div>';
loadData();
</script>
</body>
</html>
